name: CI

# Build and test every pull request and every push to a non-main branch, so
# nothing reaches main unverified. Pushes to main are covered by the Release
# workflow, which runs the same build and test steps before publishing.
on:
  workflow_call:
  pull_request:
  push:
    branches-ignore: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION: M32LiveConsoleTool.slnx
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" -c Release --no-restore

      - name: Test
        run: dotnet test "$SOLUTION" -c Release --no-build --logger trx --logger "console;verbosity=normal" --collect:"XPlat Code Coverage" --blame-hang-timeout 60s --blame-hang-dump-type mini --results-directory TestResults

      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: TestResults/

      - name: Publish portable executable
        run: |
          rid=$(dotnet msbuild M32LiveConsoleTool.csproj -nologo -getProperty:NETCoreSdkRuntimeIdentifier)
          dotnet publish M32LiveConsoleTool.csproj -c Release -r "$rid" --self-contained true -p:PublishSingleFile=true -o publish/smoke

      - name: Smoke test portable executable
        run: |
          executable=publish/smoke/M32LiveConsoleTool
          if [ "$RUNNER_OS" = "Windows" ]; then executable="$executable.exe"; fi
          "$executable" --self-test
